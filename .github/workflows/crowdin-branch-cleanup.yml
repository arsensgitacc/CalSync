name: Crowdin branch cleanup

on:
  delete:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: |
      startsWith(github.event.ref || github.event.pull_request.head.ref, 'feature/') ||
      startsWith(github.event.ref || github.event.pull_request.head.ref, 'bugfix/') ||
      startsWith(github.event.ref || github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: crowdin/github-action@v3
        continue-on-error: true
        with:
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          upload_sources: false
          command: 'branch delete'
          command_args: '${{ github.event.ref || github.event.pull_request.head.ref }}'
