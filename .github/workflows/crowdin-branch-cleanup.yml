name: Crowdin branch cleanup

on:
  delete:

jobs:
  cleanup:
    if: |
      startsWith(github.event.ref, 'feature/') ||
      startsWith(github.event.ref, 'bugfix/') ||
      startsWith(github.event.ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve Crowdin-safe branch name
        id: crowdin_branch
        run: echo "name=${GIT_BRANCH//\//.}" >> "$GITHUB_OUTPUT"
        env:
          GIT_BRANCH: ${{ github.event.ref }}
      - uses: crowdin/github-action@v3
        continue-on-error: true
        with:
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          upload_sources: false
          command: 'branch delete'
          command_args: '${{ steps.crowdin_branch.outputs.name }}'
