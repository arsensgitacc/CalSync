name: Crowdin translations ready

on:
  repository_dispatch:
    types: [crowdin-translation-ready]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to pull translations for'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-translations-${{ github.event.client_payload.branch || inputs.branch }}
  cancel-in-progress: true

jobs:
  open-translations-pr:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
    if: |
      startsWith(github.event.client_payload.branch || inputs.branch, 'feature/') ||
      startsWith(github.event.client_payload.branch || inputs.branch, 'bugfix/') ||
      startsWith(github.event.client_payload.branch || inputs.branch, 'hotfix/')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: crowdin/github-action@v3
        with:
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          upload_sources: false
          download_translations: true
          skip_ref_checkout: true
          crowdin_branch_name: ${{ env.TARGET_BRANCH }}
          skip_untranslated_strings: true
          skip_untranslated_files: true
          create_pull_request: true
          pull_request_base_branch_name: ${{ env.TARGET_BRANCH }}
          localization_branch_name: l10n-custom_${{ env.TARGET_BRANCH }}
          pull_request_title: 'New Crowdin translations for ${{ env.TARGET_BRANCH }}'
          commit_message: 'chore: update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
